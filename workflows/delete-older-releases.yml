#
# 自动清理旧 Release
# 保留最新的 N 个 Release，删除其余的旧版本
#
name: Delete Older Releases

on:
  workflow_dispatch:
    inputs:
      keep_latest:
        description: 'Number of latest releases to keep'
        required: true
        default: '10'
        type: string
      delete_tags:
        description: 'Also delete associated tags'
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '0 2 * * 0'  # 每周日凌晨 2 点自动执行

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
    - name: Delete Older Releases
      uses: dev-drprasad/delete-older-releases@v0.3.4
      with:
        keep_latest: ${{ github.event.inputs.keep_latest || 10 }}
        delete_tags: ${{ github.event.inputs.delete_tags != 'false' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
