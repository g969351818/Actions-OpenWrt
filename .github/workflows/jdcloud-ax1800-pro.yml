#
# JDCloud AX1800 Pro / AX6600 - Lean's OpenWrt (LEDE) 编译工作流
# 源码: coolsnowwolf/lede (非 immortalwrt)
# 调用通用编译工作流
#
name: jdcloud-ax1800-pro

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      LAN_IP:
        description: 'Set LAN IP Address'
        required: true
        default: '192.168.1.1'
      NO_DOCKERMAN:
        description: 'Not build luci-app-dockerman'
        required: true
        default: false
        type: boolean
      ssh:
        description: 'SSH connection to Actions'
        required: false
        default: 'false'
#  schedule:
#    - cron: 0 16 * * *

permissions:
  contents: write
  actions: read

jobs:
  build:
    uses: ./.github/workflows/build-openwrt.yml
    with:
      openwrt_name: lede
      upload_tag_name: jdcloud-ax1800-pro
      repo_url: https://github.com/coolsnowwolf/lede
      repo_branch: master
      config_file: jdcloud-ax1800-pro/.config
      feeds_conf: feeds.conf.default
      diy_p1_sh: jdcloud-ax1800-pro/diy-part1.sh
      diy_p2_sh: jdcloud-ax1800-pro/diy-part2.sh
      patch_file: jdcloud-ax1800-pro/jdcloud-ax1800-pro.patch
      release_notes: '- 设备：JDCloud AX1800 Pro / AX6600\n- 源码：Lean'\''s LEDE\n- 架构：ipq60xx'
      no_dockerman: ${{ github.event.inputs.NO_DOCKERMAN == 'true' }}
      ssh_enabled: ${{ github.event.inputs.ssh == 'true' }}
      lan_ip: ${{ github.event.inputs.LAN_IP }}
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
