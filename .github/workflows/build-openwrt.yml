#
# OpenWrt 通用编译工作流 (Reusable Workflow)
# 支持多设备矩阵编译、缓存优化、安全加固
#
name: Build OpenWrt

on:
  workflow_call:
    inputs:
      openwrt_name:
        description: 'OpenWrt source name (immortalwrt/lede)'
        required: true
        type: string
      upload_tag_name:
        description: 'Upload tag name'
        required: true
        type: string
      repo_url:
        description: 'OpenWrt repository URL'
        required: true
        type: string
      repo_branch:
        description: 'Repository branch'
        required: true
        type: string
      config_file:
        description: 'Path to .config file'
        required: true
        type: string
      feeds_conf:
        description: 'Path to feeds.conf.default'
        required: false
        type: string
        default: 'feeds.conf.default'
      diy_p1_sh:
        description: 'Path to diy-part1.sh'
        required: false
        type: string
        default: ''
      diy_p2_sh:
        description: 'Path to diy-part2.sh'
        required: false
        type: string
        default: ''
      patch_file:
        description: 'Path to patch file'
        required: false
        type: string
        default: ''
      release_notes:
        description: 'Additional release notes'
        required: false
        type: string
        default: ''
      no_dockerman:
        description: 'Skip luci-app-dockerman'
        required: false
        type: boolean
        default: false
      ssh_enabled:
        description: 'Enable SSH debug'
        required: false
        type: boolean
        default: false
      lan_ip:
        description: 'Custom LAN IP'
        required: false
        type: string
        default: ''
    secrets:
      repo_token:
        required: false

env:
  TZ: Asia/Shanghai

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
        sudo -E apt-get -yqq update
        sudo -E apt-get -yqq install curl dos2unix python3-netifaces libfuse-dev ccache \
          build-essential clang flex bison g++ gawk gcc-multilib gettext git \
          libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev \
          file wget llvm python3-pyelftools libpython3-dev aria2 jq qemu-utils \
          libelf-dev device-tree-compiler libgmp3-dev libmpc-dev
        sudo -E apt-get -yqq autoremove --purge
        sudo -E apt-get -yqq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        swap-storage: false

    - name: Clone Source
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone --depth 1 ${{ inputs.repo_url }} -b ${{ inputs.repo_branch }} openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Setup ccache
      uses: actions/cache@v4
      with:
        path: /workdir/openwrt/.ccache
        key: ccache-${{ inputs.upload_tag_name }}-${{ github.run_id }}
        restore-keys: |
          ccache-${{ inputs.upload_tag_name }}-

    - name: Load Feeds & DIY Part1
      run: |
        if [ -e "${{ inputs.feeds_conf }}" ]; then
          mv "${{ inputs.feeds_conf }}" openwrt/feeds.conf.default
        fi
        if [ -n "${{ inputs.diy_p1_sh }}" ] && [ -e "${{ inputs.diy_p1_sh }}" ]; then
          chmod +x "${{ inputs.diy_p1_sh }}"
          cd openwrt
          "$GITHUB_WORKSPACE/${{ inputs.diy_p1_sh }}"
        fi

    - name: Apply Patch
      if: inputs.patch_file != ''
      run: |
        if [ -e "${{ inputs.patch_file }}" ]; then
          cp "${{ inputs.patch_file }}" openwrt/
          cd openwrt
          git apply "$(basename ${{ inputs.patch_file }})"
        else
          echo "::warning::Patch file not found: ${{ inputs.patch_file }}"
        fi

    - name: Update Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Load Config & DIY Part2
      run: |
        if [ -e "${{ inputs.config_file }}" ]; then
          mv "${{ inputs.config_file }}" openwrt/.config
        fi
        if [ -n "${{ inputs.diy_p2_sh }}" ] && [ -e "${{ inputs.diy_p2_sh }}" ]; then
          chmod +x "${{ inputs.diy_p2_sh }}"
          cd openwrt
          "$GITHUB_WORKSPACE/${{ inputs.diy_p2_sh }}"
        fi

    - name: Set LAN IP
      if: inputs.lan_ip != ''
      run: |
        cd openwrt
        SET_IP="${{ inputs.lan_ip }}"
        if [[ $SET_IP =~ ^(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$ ]]; then
          sed -i "s/192\.168\.[0-9]*\.[0-9]*/$SET_IP/g" package/base-files/files/bin/config_generate
          find feeds -name "flash.js" -exec sed -i "s/192\.168\.[0-9]*\.[0-9]*/$SET_IP/g" {} \; 2>/dev/null || true
          echo "Set LAN IP: $SET_IP"
        fi

    - name: Remove Dockerman
      if: inputs.no_dockerman
      run: |
        cd openwrt
        sed -i '/CONFIG_PACKAGE_luci-app-dockerman=y/d' .config

    - name: SSH Debug
      uses: lhotari/action-upterm@v1
      if: inputs.ssh_enabled

    - name: Download Packages
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j$(nproc)
        find dl -size -1024c -exec rm -f {} \;

    - name: Compile Firmware
      id: compile
      run: |
        cd openwrt
        echo "$(nproc) threads compile"
        make -j$(nproc) || make -j1 V=s
        
        # Extract IP address
        IP_ADDR=$(sed -nE 's/.*(192\.168\.[0-9]+\.[0-9]+).*/\1/p' package/base-files/files/bin/config_generate | head -n1)
        [ -n "$IP_ADDR" ] && echo "IP_ADDR=$IP_ADDR" >> $GITHUB_ENV
        
        # Check dockerman
        if grep -q 'CONFIG_PACKAGE_luci-app-dockerman=y' .config; then
          echo "BUILD_DOCKERMAN=-docker" >> $GITHUB_ENV
        else
          echo "BUILD_DOCKERMAN=" >> $GITHUB_ENV
        fi
        
        echo "FILE_DATE=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Check Disk Usage
      if: always()
      run: df -hT

    - name: Organize Files
      id: organize
      if: env.status == 'success' && !cancelled()
      run: |
        cd openwrt
        
        # Extract device names
        mapfile -t devices < <(grep '^CONFIG_TARGET.*DEVICE_.*=y' .config | grep -v 'PER_DEVICE\|DEVICE_PACKAGES' | sed -n 's/.*DEVICE_\([^=]*\)=y/\1/p')
        
        cd bin/targets/*/*
        rm -rf packages
        
        # Clean unnecessary files
        find . -iregex ".*\(bl31-uboot.fip\|gpt.bin\|preloader.bin\|bl2.bin\)$" -delete 2>/dev/null || true
        
        # Rename files
        for device in "${devices[@]}"; do
          for file in *"${device}"*; do
            if [ -f "$file" ]; then
              suffix="${file#*${device}}"
              new_name="${{ env.FILE_DATE }}-${{ inputs.openwrt_name }}-${device}${{ env.BUILD_DOCKERMAN }}${suffix}"
              mv "$file" "$new_name"
            fi
          done
        done
        
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: ${{ env.FILE_DATE }}-${{ inputs.openwrt_name }}-${{ inputs.upload_tag_name }}${{ env.BUILD_DOCKERMAN }}
        path: ${{ env.FIRMWARE }}

    - name: Create Release
      id: tag
      if: steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        cat > release.txt << EOF
        - 源码：${{ inputs.repo_url }}
        - 分支：${{ inputs.repo_branch }}
        - 登录地址：${{ env.IP_ADDR }}
        ${{ inputs.release_notes }}
        EOF
        
        if [ -n "${{ env.BUILD_DOCKERMAN }}" ]; then
          echo "- 已编译 luci-app-dockerman" >> release.txt
        else
          echo "- 未编译 luci-app-dockerman" >> release.txt
        fi
        
        RELEASE_TAG="v${{ env.FILE_DATE }}-${{ inputs.upload_tag_name }}${{ env.BUILD_DOCKERMAN }}"
        echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT

    - name: Publish Release
      uses: softprops/action-gh-release@v2
      if: steps.tag.outputs.release_tag != '' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.repo_token || secrets.GITHUB_TOKEN }}
      with:
        files: ${{ env.FIRMWARE }}/*
        name: ${{ env.FILE_DATE }}-${{ inputs.openwrt_name }}-${{ inputs.upload_tag_name }}${{ env.BUILD_DOCKERMAN }}
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
